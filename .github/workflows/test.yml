name: Test
on:
  pull_request:
jobs:
  test-pr-review:
    name: runner / shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/
        continue-on-error: true
        with:
          filter_mode: file
          reviewdog_flags: -fail-on-error
      - name: check the exit code
        if: ${{ !success() }}
        run: echo 'The previous step should fail' && exit 1
  test-path:
    name: runner / shfmt (path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: whitespace-only path skips shfmt
        run: ./script.sh
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          INPUT_PATH: ' '
      - name: check nothing was formatted
        run: git diff --exit-code
      - name: path formats only the given file
        run: ./script.sh
        env:
          GITHUB_ACTION_PATH: ${{ github.workspace }}
          INPUT_PATH: testdata/subdir/test.sh
      - name: check only the given file was formatted
        run: test "$(git diff --name-only)" = testdata/subdir/test.sh
